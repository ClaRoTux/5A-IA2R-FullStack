<h1>{{ edition() ? 'Modifier le film' : 'Nouveau film' }}</h1>

@if (film.error()) {
<p class="erreur">{{ film.error()?.message }}</p>
} @else if (film.isLoading()) {
<p>Chargement…</p>
} @else {
<form #form="ngForm" (ngSubmit)="enregistrer()">
    <label>
        Titre
        <input name="titre" [(ngModel)]="titre" required />
    </label>
    <label>
        Réalisateur
        <input name="realisateur" [(ngModel)]="realisateur" required />
    </label>
    <label>
        Date de sortie
        <input name="dateSortie" type="date" [(ngModel)]="dateSortie" required />
    </label>
    <label>
        Genre
        <select name="genre" [(ngModel)]="genre" required>
            <option [ngValue]="null" disabled>— Choisir —</option>
            @for (g of genres; track g) {
            <option [ngValue]="g">{{ g }}</option>
            }
        </select>
    </label>

    <div class="actions">
        <button type="submit" [disabled]="form.invalid">Enregistrer</button>
        <a [routerLink]="edition() ? ['/films', filmId()] : ['/films']">Annuler</a>
    </div>
</form>
}

@if (erreur()) {
<p class="erreur">{{ erreur() }}</p>
}
