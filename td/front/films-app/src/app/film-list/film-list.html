<h1>Liste des films</h1>
<a routerLink="/films/nouveau">Nouveau film</a>

@if (erreurAction()) {
<p class="erreur">{{ erreurAction() }}</p>
}

@if (films.error()) {
<p class="erreur">{{ films.error()?.message }}</p>
} @else if (films.isLoading()) {
<p>Chargement…</p>
} @else {
@for (f of films.value(); track f.id) {
<app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
} @empty {
<p>Aucun film enregistré.</p>
}
}
