/*
 * build.gradle de référence du cours (slide « Le build.gradle de référence »).
 *
 * Aucune version n'est fixée manuellement sur les dépendances Spring : le
 * plugin io.spring.dependency-management importe le BOM Spring Boot, qui aligne
 * les versions entre elles. Une seule version est à faire évoluer, celle du
 * plugin org.springframework.boot.
 */

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot'        version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // spring-boot-starter-webmvc apporte Spring MVC, Jackson et un Tomcat embarqué.
    // Aucun numéro de version : le BOM Spring Boot les fixe.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // le driver n'est requis qu'à l'exécution : aucun import org.postgresql dans le code
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.polytech.spring.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
